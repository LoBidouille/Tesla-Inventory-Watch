name: Standalone web app
on:
  push:
    paths: ['webapp/**', '.github/workflows/webapp.yml']
  pull_request:
    paths: ['webapp/**', '.github/workflows/webapp.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: webapp/requirements-test.lock
      - run: python -m pip install --require-hashes -r requirements-test.lock
      - run: python -m unittest discover -s tests -v
      - run: docker build -t tesla-inventory-web:test .
      - name: Browser workflow inside the built image
        run: >-
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges:true
          --shm-size=512m --tmpfs /tmp:size=512m,mode=1777
          --tmpfs /home/app/.cache:size=128m,uid=10001,gid=10001,mode=0700
          -v "$PWD/tests:/tests:ro" tesla-inventory-web:test python /tests/browser_smoke.py
