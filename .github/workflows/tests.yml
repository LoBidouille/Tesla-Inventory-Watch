name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        homeassistant: ['2026.3.0', '2026.10.2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install "homeassistant==${{ matrix.homeassistant }}" curl-cffi==0.16.3
      - run: python -m unittest discover -s tests -v
